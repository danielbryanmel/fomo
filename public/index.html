<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: ocupa a área do notch no iPhone (o app trata safe areas).
         maximum-scale=1: evita o zoom automático do Safari ao focar campos. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>FOMO · de olho no rolê</title>
    <meta name="description" content="Descubra onde está bom agora: mapa da noite, relatos ao vivo e quem você segue." />
    <meta name="theme-color" content="#0A0A0C" />
    <meta name="color-scheme" content="dark" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FOMO" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Prévia ao compartilhar o link (WhatsApp etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FOMO · de olho no rolê" />
    <meta property="og:description" content="Onde está bom agora? Mapa da noite, relatos ao vivo e o rolê de quem você segue. Versão de testes." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <style id="expo-reset">
      html, body { height: 100%; background: #0A0A0C; }
      body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
      /* evita o "pull to refresh" e o bounce do Safari puxando a página inteira */
      html { overscroll-behavior: none; }
      /* splash enquanto o JS carrega */
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0A0A0C; z-index: 0; }
      #boot svg { width: 72px; height: 72px; animation: bootPulse 1.6s ease-in-out infinite; }
      @keyframes bootPulse { 50% { opacity: .55; transform: scale(.94); } }
      @media (prefers-reduced-motion: reduce) { #boot svg { animation: none; } }
    </style>
  </head>
  <body>
    <noscript>O FOMO precisa de JavaScript para funcionar.</noscript>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 100 100"><defs><linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#C938AE"/><stop offset=".55" stop-color="#B93AC6"/><stop offset="1" stop-color="#8A36E8"/></linearGradient></defs>
        <path fill="url(#bg)" d="M65.658 2.515A50 50 0 1 0 97.330 33.879A27.3 27.3 0 1 1 65.658 2.515Z"/></svg>
    </div>
    <div id="root"></div>
    <script>
      // Service worker: só em produção (https) — permite instalar e abrir mais rápido.
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
      }
    </script>
  </body>
</html>
